
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <title>犬の音楽再生テスト</title>

  <style>
    body { margin: 0; font-family: sans-serif; }
    #panel {
      position: fixed;
      top: 20px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      padding: 16px;
      background: white;
      border-radius: 12px;
      text-align: center;
      z-index: 1000;
    }
    button {
      padding: 12px 20px;
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div id="panel">
    <div id="message">犬のイラストを映してね</div>
    <button id="playButton" hidden>音楽を再生</button>
  </div>

  <audio id="music" src="./music.mp3"
         preload="auto"></audio>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0"
      look-controls="enabled: false"></a-camera>

    <a-entity id="target"
      mindar-image-target="targetIndex: 0">
    </a-entity>
  </a-scene>

  <script>
    const music = document.querySelector("#music");
    const target = document.querySelector("#target");
    const message = document.querySelector("#message");
    const button = document.querySelector("#playButton");

    let started = false;

    target.addEventListener("targetFound", async () => {
      if (started) return;

      message.textContent = "認識成功！";

      try {
        await music.play();
        started = true;
        message.textContent = "音楽再生中♪";
      } catch (error) {
        message.textContent = "再生ボタンを押してね";
        button.hidden = false;
      }
    });

    button.addEventListener("click", async () => {
      try {
        await music.play();
        started = true;
        button.hidden = true;
        message.textContent = "音楽再生中♪";
      } catch (error) {
        message.textContent = "再生エラー";
      }
    });

    music.addEventListener("ended", () => {
      started = false;
      message.textContent = "再生終了！";
    });
  </script>
</body>
</html>
